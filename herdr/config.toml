# herdr 設定
# リファレンス: https://herdr.dev/docs/keyboard/
# 既定値の雛形: herdr --default-config
# 設定リロード: prefix+Shift+R または herdr server reload-config

[keys]
# tmux / WezTerm から引き継いだ prefix。
# macOS の入力ソース切替も Ctrl+Space だが、キーボードレイアウトが ABC のみのため衝突しない。
prefix = "ctrl+space"

# 上下分割は WezTerm の leader+s に合わせる（既定は prefix+minus）
split_horizontal = "prefix+s"
# prefix+s を分割に譲り、設定画面は空いた prefix+- へ
settings = "prefix+minus"

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
# フォーカス中の行の背景。既定（tokyo-night は #232636）より一段濃くする。
# Agents パネルはタブ名の色をフォーカスで出し分けられないので、行全体の背景で示す。
active_row_bg = "#313850"

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
# 既定は [["state_icon", "workspace", "tab"], ["agent"]]。
# エージェント名を1行目に寄せ、タブ名を独立した行にする。
# tab は workspace 名と同じ白（#c0caf5 = tokyo-night の text の実値）にする。
# Agents パネルの副次テキストには既定で DIM が付く。dim = false で外すと
# workspace 名と同じ濃さになるが、主従を残したいため DIM はそのままにする。
# テーマを変えたらこの色も見直すこと。
rows = [
  ["state_icon", "workspace", "agent"],
  # 紫（Spaces のブランチ名と同じ mauve）に戻す場合はこちらを使う
  # [{ token = "tab", fg = "#bb9af7", dim = true }],
  [{ token = "tab", fg = "#c0caf5", dim = true }],
]

[experimental]
# サーバ再起動後にペインの画面内容を復元する（既定は off）。
# 出力は ~/.config/herdr/session-history.json に平文で保存されるため、
# 画面に出したトークンや秘密情報もディスクに残る。シェル履歴と同等の扱いにすること。
pane_history = true
