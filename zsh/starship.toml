"$schema" = 'https://starship.rs/config-schema.json'

# プロンプト構成（左 → 右）
# ┌──────┬──────────────────────────────────────────────────────────┬──────────────────────────┬────────────────────────────────────────┐
# │ 順序 │ セグメント                                                │ 背景色（mono パレット）  │ 表示内容                                │
# ├──────┼──────────────────────────────────────────────────────────┼──────────────────────────┼────────────────────────────────────────┤
# │ 1    │ $username                                                │ color_orange (#505050)   │ ユーザー名                              │
# │ 2    │ $directory                                               │ color_yellow (#454545)   │ カレントディレクトリ（3階層 truncation） │
# │ 3    │ $git_branch + $git_status                                │ color_aqua   (#3a3a3a)   │ ブランチ名と件数（! + - ? ⇡ ⇣）          │
# │ 4    │ $c $cpp $rust $golang $nodejs $bun $php $java            │ color_blue   (#303030)   │ 言語ランタイムのバージョン               │
# │      │ $kotlin $haskell $python                                 │                          │                                        │
# │ 5    │ $docker_context $conda $pixi                             │ color_bg3    (#262626)   │ コンテナ / 環境マネージャ                │
# │ 6    │ $time                                                    │ color_bg1    (#1c1c1c)   │ 現在時刻（%R）                           │
# │ 7    │ $line_break + $character                                 │ （透過）                 │ プロンプト記号 ❯（状態色で切替）         │
# └──────┴──────────────────────────────────────────────────────────┴──────────────────────────┴────────────────────────────────────────┘
#
# - 各セグメント間は [](fg:前 bg:次) の powerline 区切りで濃 → 淡へ段階的に繋ぐ
# - $character は success=文字色 / error=赤 / vim REPLACE=紫 / VISUAL=黄 で色分け
# - $git_status は ${count} で件数表示（例: !2 ?1）

format = """
[](color_orange)\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$time\
[](fg:color_bg1)\
$line_break$character"""

palette = 'mono'

# モノクロパレット：各セグメントは濃淡の異なるグレー、
# success/error/vim の状態色だけ識別用に残す（p10k Lean 風）
[palettes.mono]
color_fg0    = '#d4d4d4'  # 明るいグレー（前景文字）
color_bg1    = '#1c1c1c'  # 最も暗いグレー（time セグメント）
color_bg3    = '#262626'  # 暗いグレー（docker セグメント）
color_blue   = '#303030'  # 中暗グレー（言語セグメント）
color_aqua   = '#3a3a3a'  # 中グレー（git セグメント）
color_yellow = '#454545'  # 中明グレー（directory セグメント）
color_orange = '#505050'  # 最も明るいセグメント（user）
color_green  = '#87af87'  # 成功インジケータ（控えめな緑）
color_red    = '#d75f5f'  # エラーインジケータ
color_purple = '#af87af'  # vim REPLACE インジケータ

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'
modified  = "!${count}"
staged    = "+${count}"
deleted   = "-${count}"
untracked = "?${count}"
ahead     = "⇡${count}"
behind    = "⇣${count}"

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[bun]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_fg0)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❯](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❯](bold fg:color_purple)'
vimcmd_replace_symbol = '[❯](bold fg:color_purple)'
vimcmd_visual_symbol = '[❯](bold fg:color_yellow)'
