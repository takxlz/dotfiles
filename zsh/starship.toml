"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
${custom.git_clean}${custom.git_dirty}${custom.git_outside}\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$time\
[](fg:color_bg1)\
$line_break$character"""

palette = 'mono'

# モノクロパレット：各セグメントは濃淡の異なるグレー、
# success/error/vim の状態色だけ識別用に残す（p10k Lean 風）
[palettes.mono]
color_fg0    = '#d4d4d4'  # 明るいグレー（前景文字）
color_bg1    = '#1c1c1c'  # 最も暗いグレー（time セグメント）
color_bg3    = '#262626'  # 暗いグレー（docker セグメント）
color_blue   = '#303030'  # 中暗グレー（言語セグメント）
color_aqua   = '#3a3a3a'  # 中グレー（git セグメント）
color_yellow = '#454545'  # 中明グレー（directory セグメント）
color_orange = '#505050'  # 最も明るいセグメント（os/user）
color_green  = '#87af87'  # 成功インジケータ（控えめな緑）
color_red    = '#d75f5f'  # エラーインジケータ
color_purple = '#af87af'  # vim REPLACE インジケータ

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[bun]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❯](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❯](bold fg:color_purple)'
vimcmd_replace_symbol = '[❯](bold fg:color_purple)'
vimcmd_visual_symbol = '[❯](bold fg:color_yellow)'


# Git の状態に応じて色を切り替える 3 モジュール
# - clean: 変更なし → 緑
# - dirty: 変更あり → 黄
# - outside: git 外 → 単純に直前→次へのパススルー chevron

[custom.git_clean]
description = "Git branch (clean)"
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git status --porcelain 2>/dev/null)"'
shell = ["sh", "--norc"]
command = "git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD 2>/dev/null"
format = "[](fg:color_yellow bg:#87af87)[   $output ](fg:#1c1c1c bg:#87af87)[](fg:#87af87 bg:color_blue)"

[custom.git_dirty]
description = "Git branch (dirty)"
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n "$(git status --porcelain 2>/dev/null)"'
shell = ["sh", "--norc"]
command = """
branch=$(git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD 2>/dev/null)
status=$(git status --porcelain 2>/dev/null)

# ワーキングツリーの変更を分類してカウント
staged=$(echo "$status"    | grep -cE "^[MARC]")
modified=$(echo "$status"  | grep -cE "^.M|^MM")
deleted=$(echo "$status"   | grep -cE "^.D|^D")
untracked=$(echo "$status" | grep -c "^??")

indicators=""
[ "$staged"    -gt 0 ] && indicators="$indicators +$staged"
[ "$modified"  -gt 0 ] && indicators="$indicators !$modified"
[ "$deleted"   -gt 0 ] && indicators="$indicators -$deleted"
[ "$untracked" -gt 0 ] && indicators="$indicators ?$untracked"

# upstream との差分
upstream=$(git rev-parse --abbrev-ref "@{u}" 2>/dev/null)
if [ -n "$upstream" ]; then
  ahead=$(git rev-list --count "${upstream}..HEAD" 2>/dev/null)
  behind=$(git rev-list --count "HEAD..${upstream}" 2>/dev/null)
  [ -n "$ahead"  ] && [ "$ahead"  != "0" ] && indicators="$indicators ⇡$ahead"
  [ -n "$behind" ] && [ "$behind" != "0" ] && indicators="$indicators ⇣$behind"
fi

printf "%s%s" "$branch" "$indicators"
"""
format = "[](fg:color_yellow bg:#d7af5f)[   $output ](fg:#1c1c1c bg:#d7af5f)[](fg:#d7af5f bg:color_blue)"

[custom.git_outside]
description = "Not in a git repo (passthrough chevron)"
when = '! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
shell = ["sh", "--norc"]
command = "true"
format = "[](fg:color_yellow bg:color_blue)"
